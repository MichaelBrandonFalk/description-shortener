name: Verify delivered desktop archives
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful desktop preview build run ID
        required: true
      platform:
        description: Archive platform to verify
        type: choice
        default: All
        options: [All, Windows, Linux]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'Linux' && '["ubuntu-22.04"]' || inputs.platform == 'Windows' && '["windows-2022"]' || '["windows-2022","ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Make room for the complete Ubuntu installer and installed model
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Description-Shortener-${{ runner.os == 'Windows' && 'Windows-x64' || 'Linux-x64' }}
          path: downloads
          run-id: ${{ inputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/verify_desktop_archive.py
        env:
          PYTHONUTF8: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Windows'
        with:
          name: Description-Shortener-Windows-x64-verified
          path: build/final-downloads/*
          compression-level: 0
          retention-days: 14
